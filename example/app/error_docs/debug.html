<!DOCTYPE html>
<html lang="{tst:text value='language'}">
<head>
    <meta charset="{tst:text value='charset'}">
    <meta name="robots" content="{tst:text value='robots'}">
    <title>{tst:text value='title'}</title>
</head>
<body class="{tst:text value='bodyClassName'}">
<h1>{tst:text value='title'}</h1>
<p><strong>{tst:text value='errorType'}</strong>: {tst:text value='errorMessage'}</p>
<p>{tst:text value='errorFile'}:{tst:text value='errorLine'}</p>
<pre>{tst:text value='backtrace'}</pre>
</body>
</html>
